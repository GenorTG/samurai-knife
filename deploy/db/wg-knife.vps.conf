# Smart Knife database tunnel — VPS end: /etc/wireguard/wg-knife.conf (root:root 0600), `systemctl enable --now wg-quick@wg-knife`.
# A point-to-point WireGuard link that carries ONLY the database traffic (Postgres 5432, pgBackRest 8432) between the
# VPS (10.77.0.1) and genorbox1 (10.77.0.2). Why not Headscale/Tailscale or TLS over the internet: deploy/db/README.md.
# genorbox1 is behind home NAT, so it dials in; the VPS has no Endpoint for it and never initiates.
# 10.77.0.0/30 avoids 100.64.0.0/10: Tailscale on genorbox1 drops CGNAT-range sources that do not arrive on tailscale0.

[Interface]
Address = 10.77.0.1/30
ListenPort = 51821
PrivateKey = <contents of /etc/wireguard/wg-knife.key on the VPS>
# Not a router: no forwarding, no NAT; only this host's own services answer on the tunnel (nftables-knife-db.nft).

[Peer]
# genorbox1
PublicKey = <genorbox1's wg-knife.pub>
PresharedKey = <contents of wg-knife.psk, the same file on both ends>
AllowedIPs = 10.77.0.2/32
