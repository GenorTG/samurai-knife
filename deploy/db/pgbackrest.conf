# repo1-host-ca-file=/etc/pgbackrest/tls/knife-ca.crt
# # archive_command returns at once; a slow or absent tunnel never blocks WAL recycling.
# archive-async=y
# # Bounded local queue if genorbox1 is away for long: past it WAL is dropped from the queue (the next backup restarts
# # the chain; replication itself is separate). 2 GiB of the 30 GB disk.
# archive-push-queue-max=2GiB
# spool-path=/var/spool/pgbackrest
# process-max=1
# tls-server-address=10.77.0.1
# tls-server-cert-file=/etc/pgbackrest/tls/vps.crt
# tls-server-key-file=/etc/pgbackrest/tls/vps.key
# tls-server-ca-file=/etc/pgbackrest/tls/knife-ca.crt
# tls-server-auth=genorbox1=knife
#
# [knife]
# pg1-path=/var/lib/postgresql/18/main

# Schedules (genorbox1, as postgres; systemd timers or cron):
#   weekly  Sun 03:30   pgbackrest --stanza=knife --type=full backup
#   daily   03:30       pgbackrest --stanza=knife --type=diff backup
#   monthly             restore test into a scratch dir + compare row counts with the primary (DB-DECOUPLING.md §2.3)
