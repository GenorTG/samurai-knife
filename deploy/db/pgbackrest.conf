# Smart Knife core database — pgBackRest (https://pgbackrest.org/configuration.html). Two copies of this file:
#   VPS (primary)        /etc/pgbackrest/pgbackrest.conf  -> the commented "VPS" block at the end, uncommented
#   genorbox1 (repo)     /etc/pgbackrest/pgbackrest.conf  -> the genorbox1 block below
# genorbox1 is the repository host AND runs the delayed standby, so backups are taken FROM THE STANDBY
# (backup-standby=y): the 1-vCPU primary only ships WAL (archive-push, asynchronous) and answers a few control calls.
# Transport: pgBackRest's own TLS server on 8432 (tls-server-*, mutual TLS with certificates from the knife-db CA, CN =
# vps / genorbox1), over the WireGuard tunnel wg-knife; no SSH keys between the hosts. Both hosts run `pgbackrest server`.
# pgBackRest takes comments only on their own lines (never after a value). Not executed by anything in the repo.
# Addresses: 10.77.0.1 = VPS, 10.77.0.2 = genorbox1 (wg-knife).

# ======================================================================== genorbox1 (repository + standby)
[global]
repo1-path=/var/lib/pgbackrest
# 4 weekly fulls, 7 daily diffs: ~4 weeks of point-in-time recovery (the privacy notice states the retention).
repo1-retention-full=4
repo1-retention-diff=7
# Encrypted at rest; the passphrase lives in the password manager, not next to the repository.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=CHANGE-ME-LONG-RANDOM
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
# Gentle: one worker, spread checkpoints on the primary, data files read from the local standby.
process-max=1
start-fast=n
backup-standby=y
log-level-console=info
log-level-file=detail
tls-server-address=10.77.0.2
tls-server-cert-file=/etc/pgbackrest/tls/genorbox1.crt
tls-server-key-file=/etc/pgbackrest/tls/genorbox1.key
tls-server-ca-file=/etc/pgbackrest/tls/knife-ca.crt
tls-server-auth=vps=knife

[knife]
# The VPS primary (its pgBackRest TLS server).
pg1-host=10.77.0.1
pg1-host-type=tls
pg1-host-cert-file=/etc/pgbackrest/tls/genorbox1.crt
pg1-host-key-file=/etc/pgbackrest/tls/genorbox1.key
pg1-host-ca-file=/etc/pgbackrest/tls/knife-ca.crt
pg1-path=/var/lib/postgresql/18/main
# The local delayed standby (deploy/db/replica-setup.sh).
pg2-path=/var/lib/postgresql/18/main
pg2-port=5433

# ======================================================================== VPS (primary): its own file
# [global]
# repo1-host=10.77.0.2
# repo1-host-type=tls
# repo1-host-cert-file=/etc/pgbackrest/tls/vps.crt
