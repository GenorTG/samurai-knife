# Smart Knife core database — pgBackRest (https://pgbackrest.org/configuration.html). Two copies of this file:
#   VPS (primary)        /etc/pgbackrest/pgbackrest.conf  -> section [global] "VPS" + [knife] pg1 only
#   genorbox1 (repo)     /etc/pgbackrest/pgbackrest.conf  -> the full file below
# genorbox1 is the repository host AND runs the delayed standby, so backups are taken FROM THE STANDBY
# (backup-standby=y): the 1-vCPU primary only ships WAL (archive-push, asynchronous) and answers a few control calls.
# Transport: pgBackRest's own TLS server (tls-server-*), over the tunnel; no SSH keys between the hosts.
# Not executed by anything in the repo. Placeholders: 100.64.0.1 = VPS tunnel address, 100.64.0.2 = genorbox1.

# ======================================================================== genorbox1 (repository + standby)
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4                  # 4 weekly fulls
repo1-retention-diff=7
repo1-cipher-type=aes-256-cbc           # encrypted at rest; the passphrase lives in the password manager, not next to it
repo1-cipher-pass=CHANGE-ME-LONG-RANDOM
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=1                           # gentle: one worker
start-fast=n                            # spread checkpoints on the primary
backup-standby=y                        # read the data files from the local standby, not the VPS
log-level-console=info
log-level-file=detail
tls-server-address=100.64.0.2
tls-server-cert-file=/etc/pgbackrest/tls/genorbox1.crt
tls-server-key-file=/etc/pgbackrest/tls/genorbox1.key
tls-server-ca-file=/etc/pgbackrest/tls/knife-ca.crt
tls-server-auth=vps=knife

[knife]
pg1-host=100.64.0.1                     # the VPS primary (pgBackRest TLS server there too)
pg1-host-type=tls
pg1-host-cert-file=/etc/pgbackrest/tls/genorbox1.crt
pg1-host-key-file=/etc/pgbackrest/tls/genorbox1.key
pg1-host-ca-file=/etc/pgbackrest/tls/knife-ca.crt
pg1-path=/var/lib/postgresql/18/main
pg2-path=/var/lib/postgresql/18/main    # the local delayed standby (deploy/db/replica-setup.sh)
pg2-port=5433

# ======================================================================== VPS (primary): its own file
