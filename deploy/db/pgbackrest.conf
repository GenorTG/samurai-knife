# Schedules (genorbox1, as postgres; systemd timers or cron):
#   weekly  Sun 03:30   pgbackrest --stanza=knife --type=full backup
#   daily   03:30       pgbackrest --stanza=knife --type=diff backup
#   monthly             restore test into a scratch dir + compare row counts with the primary (DB-DECOUPLING.md §2.3)
