# Smart Knife database tunnel — genorbox1 end: /etc/wireguard/wg-knife.conf (root:root 0600), `systemctl enable --now wg-quick@wg-knife`.
# Independent of the Tailscale client on genorbox1 (which stays on its own tailnet): own interface, own /30, own keys.
# Only 10.77.0.1/32 is routed into the tunnel, so no other traffic of genorbox1 changes path.

[Interface]
Address = 10.77.0.2/30
PrivateKey = <contents of /etc/wireguard/wg-knife.key on genorbox1>
MTU = 1380                                     # head-room for PPPoE/DS-Lite home uplinks; 1420 is fine on plain Ethernet

[Peer]
# the VPS
PublicKey = <the VPS's wg-knife.pub>
PresharedKey = <contents of wg-knife.psk, the same file on both ends>
Endpoint = <VPS public IPv4 or DNS name>:51821
AllowedIPs = 10.77.0.1/32
PersistentKeepalive = 25                       # keeps the home NAT mapping open, so the VPS -> genorbox1 direction
                                               # (archive-push to pgBackRest on 10.77.0.2:8432) always works
