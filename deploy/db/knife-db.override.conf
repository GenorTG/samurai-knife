# Smart Knife core database — systemd drop-in for the VPS cluster:
#   /etc/systemd/system/postgresql@18-main.service.d/knife-db.override.conf, then `systemctl daemon-reload`.
[Unit]
# listen_addresses names 10.77.0.1, which exists only once the tunnel is up: start (and restart) after it.
Wants=wg-quick@wg-knife.service
After=wg-quick@wg-knife.service

[Service]
# 1 GB box shared with Postfix, Headscale and Caddy: the kernel OOM killer should pick a backend or another service,
# never the postmaster (a killed postmaster = every connection gone + crash recovery). Backends reset to 0 themselves
# (PG_OOM_ADJUST_*), so a runaway query is still the first to go (docs: "Linux Memory Overcommit").
OOMScoreAdjust=-900
Environment=PG_OOM_ADJUST_FILE=/proc/self/oom_score_adj
Environment=PG_OOM_ADJUST_VALUE=0
# Soft cap: above this the kernel reclaims Postgres's page cache first instead of squeezing the mail relay.
MemoryHigh=450M
