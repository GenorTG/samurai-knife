# Smart Knife core database — client authentication on the PRIMARY (VPS): /etc/postgresql/18/main/pg_hba.conf.
# TLS + SCRAM only; nothing on the public interface (listen_addresses is loopback + the WireGuard address 10.77.0.1,
# and nftables drops 5432 everywhere else: nftables-knife-db.nft).
#
#   10.77.0.2 = genorbox1 on the point-to-point WireGuard tunnel wg-knife (deploy/db/wg-knife.*.conf)
#
# TYPE     DATABASE      USER              ADDRESS           METHOD
local      all           postgres                            peer
# Local checks on the VPS itself (psql -h localhost):
hostssl    knife         knife_owner       127.0.0.1/32      scram-sha-256
hostssl    knife         knife_app         127.0.0.1/32      scram-sha-256
# Migrations (npm run db:migrate, as knife_owner) run from genorbox1, where the release checkout lives:
hostssl    knife         knife_owner       10.77.0.2/32      scram-sha-256
# The app (and its accounts CLI / db:import) on genorbox1:
hostssl    knife         knife_app         10.77.0.2/32      scram-sha-256
# The delayed read replica + pgBackRest's backup-standby on genorbox1 (physical replication; no database access):
hostssl    replication   knife_replicator  10.77.0.2/32      scram-sha-256
# Everything else: refused.
host       all           all               0.0.0.0/0         reject
host       all           all               ::/0              reject
