# Smart Knife core database — client authentication on the PRIMARY (VPS). Replace the default pg_hba.conf entries for
# TCP with these (keep the `local` peer lines for the postgres OS user). TLS + SCRAM only; nothing on the public interface
# (listen_addresses is loopback + the tunnel address, and the host firewall drops 5432 elsewhere).
#
#   APP_HOST = genorbox1's tunnel address (WireGuard / Tailscale through the VPS's own Headscale), e.g. 100.64.0.2
#
# TYPE     DATABASE      USER              ADDRESS           METHOD
local      all           postgres                            peer
# Migrations and the accounts CLI on the VPS itself:
hostssl    knife         knife_owner       127.0.0.1/32      scram-sha-256
hostssl    knife         knife_app         127.0.0.1/32      scram-sha-256
# The app (and its accounts CLI / db:import) on genorbox1:
hostssl    knife         knife_app         100.64.0.2/32     scram-sha-256
# The delayed read replica + pgBackRest on genorbox1 (physical replication; no database access):
hostssl    replication   knife_replicator  100.64.0.2/32     scram-sha-256
# Everything else: refused.
host       all           all               0.0.0.0/0         reject
host       all           all               ::/0              reject
