# Smart Knife core database — PRIMARY on the VPS (docs/DB-POSTGRES.md "VPS"). Drop into
# /etc/postgresql/18/main/conf.d/knife.conf (Debian/PGDG layout; include_dir 'conf.d' is on by default) and restart.
# Sized for TODAY's VPS: 1 vCPU / 1 GB RAM / 30 GB, Debian 13, shared with the Postfix relay, Headscale and Caddy
# (together ~250-350 MB). Postgres is budgeted at ~300 MB resident: 128 MB shared_buffers + ~8 busy backends.
# Bigger VPS: the two "later:" columns are 4 vCPU / 16 GB and 8 vCPU / 32 GB (dedicated to the app + database).
# Not applied by any script in the repo: the owner installs it (deploy/db/README.md).

# --- connections ------------------------------------------------------------------------------------------------------
# One app instance = one writer: its pool (KNIFE_DB_POOL_MAX, default 4) + the listener/lock connection + the accounts
# CLI + migrations + the replica + pgBackRest. No PgBouncer needed at this size.
listen_addresses = 'localhost,10.77.0.1'       # loopback + the WireGuard tunnel address ONLY (wg-knife), never public;
                                               # postgresql@18-main starts after wg-quick@wg-knife (knife-db.override.conf)
port = 5432
max_connections = 20                           # later: 50 | 100 (several app instances -> PgBouncer in front then)
superuser_reserved_connections = 3
password_encryption = scram-sha-256
ssl = on                                       # TLS even inside the tunnel (defence in depth); the app uses verify-full
ssl_cert_file = '/etc/postgresql/18/main/tls/server.crt'
ssl_key_file = '/etc/postgresql/18/main/tls/server.key'
ssl_ca_file = '/etc/postgresql/18/main/tls/knife-ca.crt'
ssl_min_protocol_version = 'TLSv1.3'
tcp_keepalives_idle = 60                       # the app keeps idle connections across a 35 ms WAN path
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
authentication_timeout = 10s

# --- memory -----------------------------------------------------------------------------------------------------------
shared_buffers = 128MB                         # later: 4GB | 8GB (25 % of RAM)
effective_cache_size = 256MB                   # what the OS can cache for us next to the other services; later: 12GB | 24GB
work_mem = 4MB                                 # tiny sorts only: the app reads whole tables once at start; later: 16MB | 32MB
hash_mem_multiplier = 2.0
maintenance_work_mem = 32MB                    # later: 512MB | 1GB
autovacuum_work_mem = 16MB                     # later: 256MB | 512MB
huge_pages = off                               # later: try (with vm.nr_hugepages sized for shared_buffers)
jit = off                                      # JIT costs more than it saves on these tiny queries

# --- processes (1 vCPU: no parallel query, few background workers) ---------------------------------------------------
max_worker_processes = 4                       # later: 8 | 16
max_parallel_workers = 1                       # later: 4 | 8
max_parallel_workers_per_gather = 0            # later: 2 | 4
max_parallel_maintenance_workers = 1           # later: 2 | 4
io_method = worker                             # PostgreSQL 18 asynchronous I/O (default); later: io_uring if the kernel allows
io_workers = 2                                 # later: 4 | 8 (PG18 default 3)
autovacuum_max_workers = 2                     # later: 3 | 4
autovacuum_naptime = 1min

# --- WAL, durability, replication -------------------------------------------------------------------------------------
wal_level = replica
synchronous_commit = on                        # stays ON: an acknowledged write is fsynced on the primary
synchronous_standby_names = ''                 # replication is ASYNCHRONOUS (the home replica never stalls a write)
fsync = on
full_page_writes = on
wal_compression = zstd                         # less WAL over the tunnel and in the archive
wal_buffers = 4MB                              # later: -1 (auto, 1/32 of shared_buffers, 16 MB cap ... 64MB)
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 1GB                             # later: 4GB | 8GB
min_wal_size = 128MB                           # later: 1GB | 2GB
max_wal_senders = 4                            # replica + pg_basebackup/pgBackRest
max_replication_slots = 4
max_slot_wal_keep_size = 3GB                   # 30 GB disk: a long home outage cannot fill it, the replica then re-syncs
                                               # from pgBackRest; later: 20GB (size it at ~10 % of the free disk)
wal_sender_timeout = 60s
archive_mode = on                              # README step 4 installs it with 'off' until pgBackRest is configured
archive_command = 'pgbackrest --stanza=knife archive-push %p'
archive_timeout = 300                          # at most 5 min of WAL waits for a segment switch when idle

# --- planner / IO (SSD/NVMe) ------------------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 64                  # virtualised SSD; later: 200 on dedicated NVMe
maintenance_io_concurrency = 16                # later: 64

# --- safety nets ------------------------------------------------------------------------------------------------------
idle_in_transaction_session_timeout = 60s
idle_session_timeout = 0                       # the app's pool keeps its connections on purpose (35 ms away)
statement_timeout = 0                          # the app sets its own (KNIFE_DB_STATEMENT_TIMEOUT_MS, 10 s)
lock_timeout = 10s
temp_file_limit = 1GB                          # a runaway query cannot fill the 30 GB disk; later: 10GB

# --- logging ----------------------------------------------------------------------------------------------------------
log_min_duration_statement = 250ms             # slow statements only (no row data at this level)
log_checkpoints = on
log_connections = 'receipt,authentication,authorization'   # PostgreSQL 18 list form (= the old "on")
log_disconnections = on
log_lock_waits = on
log_replication_commands = on
log_temp_files = 0
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d %h '
